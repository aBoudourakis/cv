<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Athinodoros Boudourakis CV</title>

    <!-- Restores the original path after the GitHub Pages 404.html SPA redirect. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <!-- Applies the initial theme before first paint, so there's no flash of
         the wrong theme. Default: the system's preference; if the browser
         can't report one either way, fall back to dark mode. ThemeSwitch.tsx
         reads this same 'dark-mode' class on mount and takes over from here. -->
    <script>
      (function () {
        try {
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var isDark = prefersDark || !prefersLight;
          document.body.classList.toggle('dark-mode', isDark);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
